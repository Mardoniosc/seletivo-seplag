<div class="mt-20"></div>

<div class="max-w-[80%] flex flex-col mx-auto p-4 items-center justify-start bg-gray-50 h-full rounded-md">
  @if (desaparecido) {
  <app-card-desaparecido class="md:w-full" [desaparecido]="desaparecido" [completo]="true"></app-card-desaparecido>
  }

  @if (desaparecido.ultimaOcorrencia.listaCartaz?.length) {
  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 w-full mt-4">
    @for (cartaz of desaparecido.ultimaOcorrencia.listaCartaz; track $index) {
    <app-card-cartaz [cartaz]="cartaz"></app-card-cartaz>
    }
  </div>
  }


  <div class="w-full flex justify-end">
    <button type="button" (click)="adicionarInformacoes()"
      class="text-white bg-blue-800 hover:bg-blue-900 focus:ring-4 focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 me-2 mb-2 focus:outline-none cursor-pointer mt-5">
      Adicionar mais informações
    </button>

    @if (!desaparecido.ultimaOcorrencia.listaCartaz?.length) {
    <app-button-compartilhar class="mt-5"></app-button-compartilhar>
    }
  </div>


</div>
