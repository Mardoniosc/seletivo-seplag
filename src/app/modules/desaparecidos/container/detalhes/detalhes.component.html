<div class="mt-20"></div>

<div class="max-w-[80%] flex flex-col mx-auto p-4 items-center justify-start bg-gray-50 h-[80vh] rounded-md">
  @if (desaparecido) {
    <app-card-desaparecido class="md:w-full" [desaparecido]="desaparecido" [completo]="true"></app-card-desaparecido>
  }

  @if (desaparecido.ultimaOcorrencia.listaCartaz.length) {
    <div class="">
      <p>Lista de cartazes</p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 w-full">
      @for (cartaz of desaparecido.ultimaOcorrencia.listaCartaz; track $index) {
      <app-card-cartaz [cartaz]="cartaz"></app-card-cartaz>
      }
    </div>
  }
</div>
